        <<: *aci_login
        path: '/api/mo/uni/tn-{{ tenant1_name }}/out-{{ l3out_t1_vrf1.name }}/lnodep-{{ l3out_t1_vrf1.node.profile }}/lifp-{{ l3out_t1_vrf1.node.interface.profile }}.json'
        method: 'post'
