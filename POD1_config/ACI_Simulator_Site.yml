---
# ACI_Simulator_Site.yml
#
# Consolidated, single-command orchestration for the full POD1 provisioning
# sequence. Replaces the need to run each playbook (and the static_ep
# scripts) as separate manual commands while preserving:
#   - strict ordering (each stage only starts after the previous succeeded)
#   - the existing per-task tags inside each imported playbook (tags are
#     additive/layered, nothing is replaced or hidden)
#   - the inter-stage cool-down that the old ACI_provisioning_POD1.sh gave
#     via `sleep 30`, now expressed as native Ansible pause tasks
#
# Usage:
#   ansible-playbook -i POD1 ACI_Simulator_Site.yml
#
# Run only a subset of stages (still respects the fine-grained tags that
# already exist inside each playbook, e.g. --tags startup_script):
#   ansible-playbook -i POD1 ACI_Simulator_Site.yml --tags tenants,networking
#
# Skip a stage:
#   ansible-playbook -i POD1 ACI_Simulator_Site.yml --skip-tags dns
#
# Override the cool-down between stages (seconds):
#   ansible-playbook -i POD1 ACI_Simulator_Site.yml -e aci_stage_pause=10

- import_playbook: ACI_Simulator_Full.yml
  tags: full

- hosts: localhost
  connection: local
  gather_facts: no
  tags: full
  tasks:
    - name: Cool-down after ACI_Simulator_Full
      ansible.builtin.pause:
        seconds: "{{ aci_stage_pause | default(30) }}"

