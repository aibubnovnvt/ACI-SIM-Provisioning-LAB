- name: Provision static endpoints (bulk EP python scripts)
  hosts: localhost
  connection: local
  gather_facts: no
  tags: static_ep
  tasks:
    - name: Run EP_provisioning_bulk_5.sh (executes static_ep/*.py in order, fails fast)
      ansible.builtin.command: ./EP_provisioning_bulk_5.sh
      args:
        chdir: "{{ playbook_dir }}"
      register: ep_bulk_result
      changed_when: true

    - name: Show static endpoint provisioning output
      ansible.builtin.debug:
        var: ep_bulk_result.stdout_lines
      when:
        - debug_output | default(false)
